<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Ray Projections</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --text:#e7e9ea; --muted:#8b98a5; --accent:#1d9bf0; --border:#38444d; --good:#00ba7c; --bad:#f4212e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  header { padding:1rem 1rem 0.5rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; }
  h1 { margin:0 0 0.6rem 0; font-size:1.35rem; }
  .tabs { display:flex; gap:0.4rem; margin-bottom:0.6rem; }
  .tabs button { background:var(--card); border:1px solid var(--border); color:var(--text); padding:0.4rem 0.9rem; border-radius:999px; cursor:pointer; font-size:0.9rem; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); color:white; }
  input[type="search"], input[type="text"] { width:100%; padding:0.7rem 1rem; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:1rem; margin-bottom:0.5rem; }
  .filters { display:flex; gap:0.5rem; overflow-x:auto; padding:0.4rem 0 0.6rem; }
  .filters button { background:var(--card); border:1px solid var(--border); color:var(--text); padding:0.3rem 0.75rem; border-radius:999px; white-space:nowrap; cursor:pointer; font-size:0.8rem; }
  .filters button.active { background:var(--accent); border-color:var(--accent); color:white; }
  main { padding:1rem; max-width:800px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-bottom:0.8rem; }
  .card h3 { margin:0 0 0.3rem 0; font-size:1.05rem; }
  .card .extremity { color:var(--accent); font-size:0.85rem; font-weight:600; }
  .detail { margin:0.25rem 0; font-size:0.95rem; }
  .detail strong { color:var(--muted); font-weight:500; }
  .count { color:var(--muted); font-size:0.85rem; margin:0.3rem 0 0.8rem; }
  .empty { text-align:center; color:var(--muted); padding:3rem 1rem; }
  .quiz-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.2rem; }
  .quiz-question { font-size:1.1rem; margin-bottom:1rem; }
  .quiz-label { display:block; margin:0.8rem 0 0.3rem; font-size:0.9rem; color:var(--muted); }
  .quiz-actions { display:flex; gap:0.6rem; margin-top:1rem; }
  .quiz-actions button { padding:0.6rem 1rem; border-radius:8px; border:none; cursor:pointer; font-size:0.95rem; }
  .btn-primary { background:var(--accent); color:white; }
  .btn-secondary { background:#38444d; color:white; }
  .feedback { margin-top:1rem; padding:0.8rem; border-radius:8px; font-size:0.95rem; }
  .feedback.good { background:#0d3d2e; color:#00ba7c; }
  .feedback.bad { background:#3d1a1c; color:#f4212e; }
  .feedback.close { background:#3d331a; color:#ffd700; }
  .hidden { display:none; }

  #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; }

  .qa-item { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem; margin-bottom:0.8rem; }
  .qa-item p { margin:0 0 0.6rem 0; }
  .answer { margin-top:0.6rem; padding:0.7rem; background:#1e2a3a; border-radius:6px; font-size:0.95rem; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<header>
  <h1>X-Ray Projections</h1>
  <div class="tabs">
    <button id="tab-ref" class="active">Reference</button>
    <button id="tab-random">Random Quiz</button>
    <button id="tab-focus">Focused Quiz</button>
    <button id="tab-mc">Multiple Choice</button>
  </div>
  <div id="ref-controls">
    <input type="search" id="search" placeholder="Search projections, extremities, or CR locations..." autocomplete="off">
    <div class="filters" id="filters"></div>
  </div>
</header>
<main>
  <div id="ref-view">
    <div class="count" id="count"></div>
    <div id="results"></div>
  </div>
  <div id="quiz-view" class="hidden">
    <div id="focus-controls" class="hidden" style="margin-bottom:1rem;">
      <label class="quiz-label">Choose extremity</label>
      <select id="focus-select" style="width:100%; padding:0.6rem; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:1rem;">
      </select>
    </div>
    <div class="quiz-box">
      <div class="quiz-question" id="quiz-question">Loading quiz...</div>
      <label class="quiz-label">CR Degree and Direction</label>
      <input type="text" id="quiz-degree" placeholder="Type your answer..." autocomplete="off">
      <label class="quiz-label">CR Location</label>
      <input type="text" id="quiz-location" placeholder="Type your answer..." autocomplete="off">
      <div id="rotation-section" class="hidden">
        <label class="quiz-label">Body Part Rotation</label>
        <input type="text" id="quiz-rotation" placeholder="Type your answer..." autocomplete="off">
      </div>
      <div class="quiz-actions">
        <button class="btn-primary" id="check-btn">Check Answer</button>
        <button class="btn-secondary" id="next-btn">Next Question</button>
        <button class="btn-secondary" id="restart-btn" style="display:none;">Start Over</button>
      </div>
      <div id="progress" style="margin-top:0.8rem; color:var(--muted); font-size:0.9rem;"></div>
      <div id="quiz-feedback"></div>
    </div>
  </div>

  <div id="mc-view" class="hidden">
    <div class="quiz-box">
      <div class="quiz-question" id="mc-question">Loading...</div>
      <div id="mc-options" style="display:flex; flex-direction:column; gap:0.6rem; margin:1rem 0;"></div>
      <div class="quiz-actions">
        <button class="btn-secondary" id="mc-next">Next Question</button>
      </div>
      <div id="mc-feedback"></div>
    </div>
  </div>


</main>

const rotationSection = document.getElementById('rotation-section');

const extremities = [...new Set(data.map(p => p.extremity))].sort();
let activeFilter = 'All';
let currentQuiz = null;

function renderFilters() {
  filtersEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = 'All';
  allBtn.className = activeFilter === 'All' ? 'active' : '';
  allBtn.onclick = () => { activeFilter = 'All'; render(); };
  filtersEl.appendChild(allBtn);
  extremities.forEach(ext => {
    const btn = document.createElement('button');
    btn.textContent = ext;
    btn.className = activeFilter === ext ? 'active' : '';
    btn.onclick = () => { activeFilter = ext; render(); };
    filtersEl.appendChild(btn);
  });
}

function matches(p, q) {
  if (!q) return true;
  const s = q.toLowerCase();
  const fields = [p.extremity, p.projection, p.crDegree, p.crLocation, p.rotation || ''];
  return fields.some(f => String(f).toLowerCase().includes(s));
}

function render() {
  const q = searchEl.value.trim();
  let filtered = data.filter(p => matches(p, q));
  if (activeFilter !== 'All') filtered = filtered.filter(p => p.extremity === activeFilter);
  countEl.textContent = filtered.length + ' projection' + (filtered.length === 1 ? '' : 's');
  if (filtered.length === 0) {
    resultsEl.innerHTML = '<div class="empty">No projections match your search.</div>';
    return;
  }
  resultsEl.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="extremity">${p.extremity}</div>
      <h3>${p.projection}</h3>
      <div class="detail"><strong>CR Degree & Direction:</strong> ${p.crDegree}</div>
      <div class="detail"><strong>CR Location:</strong> ${p.crLocation}</div>
      ${hasRotation(p) ? `<div class="detail"><strong>Body Part Rotation:</strong> ${p.rotation}</div>` : ''}
    </div>
  `).join('');
}

let quizMode = 'random';
let focusQueue = [];
let focusIndex = 0;
let focusCorrect = 0;

function getQuizPool() {
  if (quizMode === 'focus' && focusSelect.value) {
    return data.filter(p => p.extremity === focusSelect.value);
  }
  return data;
}


let fwAudioCtx = null;
function getAudioCtx() {
  try {
    if (!fwAudioCtx) fwAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (fwAudioCtx.state === 'suspended') fwAudioCtx.resume();
  } catch (e) { fwAudioCtx = null; }
  return fwAudioCtx;
}

function playPop(delay, volume) {
  const ac = getAudioCtx();
  if (!ac) return;
  const t = ac.currentTime + delay;
  const len = Math.floor(ac.sampleRate * 0.25);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1800 + Math.random() * 1200;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(volume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
  src.start(t);
}

const CELEBRATION = 'bats'; // 'bats', 'confetti' or 'fireworks'
function launchConfetti() {
  if (CELEBRATION === 'bats') launchBats();
  else if (CELEBRATION === 'fireworks') launchFireworks();
  else launchConfettiPop();
}
// Soft fluttery "whoosh": band-passed noise with a quick swell and a sweeping, wobbling filter (no crackle)
function playWhoosh(delay, volume) {
  const ac = getAudioCtx();
  if (!ac) return;
  const t = ac.currentTime + delay;
  const dur = 0.55;
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const p = i / len;
    const env = Math.sin(Math.PI * Math.min(1, p * 1.6)) * Math.pow(1 - p, 1.5);
    const flutter = 0.6 + 0.4 * Math.sin(2 * Math.PI * 22 * (i / ac.sampleRate)); // wing-beat tremolo
    d[i] = (Math.random() * 2 - 1) * env * flutter;
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 0.9;
  filter.frequency.setValueAtTime(500, t);
  filter.frequency.exponentialRampToValueAtTime(1800, t + dur * 0.5);
  filter.frequency.exponentialRampToValueAtTime(900, t + dur);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(volume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
  src.start(t);
}

// One bat silhouette, front view, centered at 0,0, wingspan ~2 units. flap: -1 (wings down) .. 1 (wings up)
function traceBat(ctx, flap) {
  ctx.beginPath();
  for (const side of [1, -1]) {
    const a = flap * 0.75;                         // wing elevation angle
    const fold = 0.72 + 0.28 * Math.cos(flap * 1.4); // foreshortening as wings sweep
    const ca = Math.cos(a), sa = Math.sin(a);
    // wing points in wing space (x out from shoulder), rotated by elevation and folded
    const P = (x, y) => {
      const wx = x * fold, wy = y;
      return [side * (0.12 + wx * ca + wy * sa * 0.6), -0.08 - wx * sa + wy * ca];
    };
    const lead = [[0, 0], [0.35, -0.16], [0.7, -0.2], [0.98, -0.06]]; // leading edge to tip
    const tips = [[0.98, -0.06], [0.72, 0.22], [0.45, 0.28], [0.18, 0.3]]; // finger tips along trailing edge
    let p = P(lead[0][0], lead[0][1]);
    ctx.moveTo(p[0], p[1]);
    p = P(lead[1][0], lead[1][1]); const q = P(lead[2][0], lead[2][1]); const r = P(lead[3][0], lead[3][1]);
    ctx.bezierCurveTo(p[0], p[1], q[0], q[1], r[0], r[1]);
    // scalloped trailing edge: each membrane bows inward between finger tips
    for (let i = 1; i < tips.length; i++) {
      const [x0, y0] = tips[i - 1], [x1, y1] = tips[i];
      const c = P((x0 + x1) / 2 - 0.02, (y0 + y1) / 2 - 0.13);
      const e = P(x1, y1);
      ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]);
    }
    const back = P(0, 0.22);
    ctx.quadraticCurveTo(side * 0.16, 0.18, back[0], back[1]);
    ctx.closePath();
  }
  // body
  ctx.moveTo(0.13, 0.02);
  ctx.ellipse(0, 0.02, 0.13, 0.26, 0, 0, Math.PI * 2);
  // head with pointed ears
  ctx.moveTo(0.11, -0.27);
  ctx.arc(0, -0.27, 0.11, 0, Math.PI * 2);
  ctx.moveTo(-0.1, -0.31); ctx.lineTo(-0.1, -0.49); ctx.lineTo(-0.02, -0.35); ctx.closePath();
  ctx.moveTo(0.1, -0.31); ctx.lineTo(0.1, -0.49); ctx.lineTo(0.02, -0.35); ctx.closePath();
}

function launchBats(testTimeMs) {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = W * 0.5, cy = H * 0.55;
  const reach = Math.hypot(W, H);
  const count = 28 + Math.floor(Math.random() * 10);
  const bats = [];
  for (let i = 0; i < count; i++) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3; // outward, mostly upward
    const size = 14 + Math.pow(Math.random(), 1.6) * 30;                // half-wingspan in px
    const dur = 1700 + Math.random() * 1100;                             // ms to reach the edge
    bats.push({
      angle, size,
      dist: reach * (0.75 + Math.random() * 0.25) + size * 2,            // far enough to be fully off-screen
      dur, delay: Math.random() * 550,
      flapRate: 0.016 + Math.random() * 0.012 + (30 - size) * 0.0003,    // small bats flap faster
      phase: Math.random() * Math.PI * 2,
      wobF: 0.004 + Math.random() * 0.005, wobA: 8 + Math.random() * 22, wobP: Math.random() * 6.28,
      glow: Math.random() < 0.55 ? 'rgba(191,90,242,0.85)' : 'rgba(255,149,0,0.85)'
    });
  }
  playWhoosh(0, 0.35);
  playWhoosh(0.22, 0.22);
  const total = 3400;
  function render(t) {
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const b of bats) {
      const lt = t - b.delay;
      if (lt < 0) { alive++; continue; }
      const p = lt / b.dur;
      if (p > 1.15) continue;
      alive++;
      const e = p * p * (0.6 + 0.4 * p) + p * 0.35;                    // accelerate out of the "cave"
      const dx = Math.cos(b.angle), dy = Math.sin(b.angle);
      const wob = Math.sin(lt * b.wobF + b.wobP) * b.wobA * Math.min(1, p * 3);
      const x = cx + dx * b.dist * e - dy * wob;
      const y = cy + dy * b.dist * e + dx * wob - Math.sin(lt * b.wobF * 2.3) * 4;
      const s = b.size * (0.35 + 0.65 * Math.min(1, p * 2.5));         // grow as they emerge
      const flap = Math.sin(lt * b.flapRate * 2 + b.phase);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(dx * 0.35 + Math.sin(lt * b.wobF + b.wobP) * 0.2);
      ctx.scale(s, s);
      ctx.globalAlpha = Math.min(1, lt / 120);
      traceBat(ctx, flap);
      ctx.lineJoin = 'round';
      ctx.lineWidth = 3.2 / s;
      ctx.strokeStyle = b.glow;
      ctx.stroke();
      ctx.fillStyle = '#07040c';
      ctx.fill();
      ctx.restore();
    }
    return alive;
  }
  if (testTimeMs != null) { render(testTimeMs); return; }
  const start = performance.now();
  function draw(now) {
    const t = now - start;
    const alive = render(t);
    if (alive && t < total + 1000) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(draw);
}


function launchConfettiPop() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const reach = Math.max(W, H) * 0.5;
  // front color + slightly darker back side, like real foil/paper confetti
  const colors = [
    ['#ff3b30','#c62a22'], ['#ff9500','#c77400'], ['#ffd60a','#c9a800'],
    ['#34c759','#24923f'], ['#00c7be','#00918b'], ['#1d9bf0','#1572b0'],
    ['#5e5ce6','#4442a8'], ['#bf5af2','#8c3fb3'], ['#ff2d92','#c0206d'],
    ['#ffffff','#cfd4da']
  ];
  const pops = [
    { x: W * 0.5,  y: H * 0.5,  delay: 0 },
    { x: W * 0.22, y: H * 0.35, delay: 16 },
    { x: W * 0.78, y: H * 0.35, delay: 32 }
  ];
  const pieces = [];
  function pop(b) {
    for (let i = 0; i < 160; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.9; // mostly upward and outward
      const speed = (reach / 22) * (0.25 + Math.random() * 0.75);
      const c = colors[Math.floor(Math.random() * colors.length)];
      const kind = Math.random();
      pieces.push({
        x: b.x, y: b.y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        w: kind < 0.15 ? 3 + Math.random() * 2 : 7 + Math.random() * 5,   // thin strips vs squares
        h: kind < 0.15 ? 14 + Math.random() * 8 : 5 + Math.random() * 5,
        round: kind > 0.9,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.2,
        tiltX: Math.random() * Math.PI * 2, vtX: 0.05 + Math.random() * 0.12,
        tiltY: Math.random() * Math.PI * 2, vtY: 0.04 + Math.random() * 0.1,
        sway: Math.random() * Math.PI * 2, vs: 0.02 + Math.random() * 0.03,
        swayAmt: 0.4 + Math.random() * 0.9,
        fall: 1.4 + Math.random() * 1.4,   // terminal fall speed (paper drifts, not drops)
        front: c[0], back: c[1]
      });
    }
  }
  pops.forEach((b, i) => playPop(b.delay / 60, i === 0 ? 0.6 : 0.45));
  let frame = 0;
  function draw() {
    pops.forEach(b => { if (b.delay === frame) pop(b); });
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      // air drag slows the blast, gravity pulls down, flat paper hits terminal speed quickly
      p.vx *= 0.93;
      p.vy = p.vy * 0.93 + 0.18;
      if (p.vy > p.fall) p.vy = p.vy * 0.9 + p.fall * 0.1;
      p.sway += p.vs;
      p.x += p.vx + Math.sin(p.sway) * p.swayAmt;
      p.y += p.vy;
      p.rot += p.vr;
      p.tiltX += p.vtX; p.tiltY += p.vtY;
      if (p.y > H + 30) { pieces.splice(i, 1); continue; }
      const sx = Math.cos(p.tiltX), sy = Math.cos(p.tiltY);
      const facing = sx * sy >= 0;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(sx, sy);
      ctx.fillStyle = facing ? p.front : p.back;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      // subtle highlight as the piece catches the light
      const shine = Math.abs(sx * sy);
      if (shine > 0.85) { ctx.fillStyle = 'rgba(255,255,255,' + ((shine - 0.85) * 2).toFixed(2) + ')'; if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    frame++;
    if ((frame < 40 || pieces.length) && frame < 1500) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, W, H);
  }
  draw();
}

function launchFireworks() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width, H = canvas.height;
  const reach = Math.max(W, H) * 0.5;
  const palettes = [
    ['#ff3b30','#ff9500','#ffcc00'],
    ['#34c759','#00e5ff','#1d9bf0'],
    ['#af52de','#ff2d92','#ff7ad9'],
    ['#ffd700','#ffffff','#ff9500'],
    ['#00ba7c','#5ac8fa','#bf5af2']
  ];
  const bursts = [
    { x: W * 0.5,  y: H * 0.45, delay: 0 },
    { x: W * 0.25, y: H * 0.25, delay: 14 },
    { x: W * 0.75, y: H * 0.3,  delay: 28 },
    { x: W * 0.3,  y: H * 0.65, delay: 42 },
    { x: W * 0.7,  y: H * 0.7,  delay: 56 }
  ];
  const particles = [];
  function burst(b, idx) {
    const pal = palettes[idx % palettes.length];
    const count = 110;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.1;
      const speed = (reach / 33) * (0.55 + Math.random() * 0.5);
      const rainbow = Math.random() < 0.35;
      particles.push({
        x: b.x, y: b.y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.007 + Math.random() * 0.006,
        color: rainbow ? 'hsl(' + Math.floor(Math.random() * 360) + ',100%,65%)' : pal[Math.floor(Math.random() * pal.length)],
        sparkle: Math.random() < 0.3
      });
    }
    // bright flash at the burst center
    particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 1, decay: 0.08, color: '#ffffff', flash: true });
  }
  bursts.forEach((b, i) => playPop(b.delay / 60, i === 0 ? 0.55 : 0.4));
  let frame = 0;
  function draw() {
    bursts.forEach((b, i) => { if (b.delay === frame) burst(b, i); });
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      if (p.flash) {
        ctx.globalAlpha = p.life;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 60);
        g.addColorStop(0, 'rgba(255,255,255,0.9)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(p.x - 60, p.y - 60, 120, 120);
        continue;
      }
      const ox = p.x, oy = p.y;
      p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.05;
      p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = p.sparkle ? p.life * (0.5 + Math.random() * 0.5) : p.life;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ox - p.vx * 2.5, oy - p.vy * 2.5);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    frame++;
    if (frame < 60 || particles.length) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, W, H);
  }
  draw();
}

const WRONG_EFFECT = 'ghost'; // 'ghost' or 'none'

// "BOO" sting: falling detuned saw stab through a closing lowpass + low sine thump + short airy whoosh (no crackle)
function playBoo() {
  const ac = getAudioCtx();
  if (!ac) return;
  const t = ac.currentTime + 0.01;
  const out = ac.createGain();
  out.gain.value = 0.5;
  out.connect(ac.destination);
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 6;
  lp.frequency.setValueAtTime(2400, t);
  lp.frequency.exponentialRampToValueAtTime(300, t + 0.55);
  const stab = ac.createGain();
  stab.gain.setValueAtTime(0.0001, t);
  stab.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
  stab.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  lp.connect(stab); stab.connect(out);
  [0, 7, -12].forEach(cents => {               // slight detune for a "boo-oo" wobble
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(330, t);
    o.frequency.exponentialRampToValueAtTime(110, t + 0.55);
    o.detune.value = cents * 3;
    o.connect(lp); o.start(t); o.stop(t + 0.62);
  });
  const sub = ac.createOscillator();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(120, t);
  sub.frequency.exponentialRampToValueAtTime(45, t + 0.4);
  const sg = ac.createGain();
  sg.gain.setValueAtTime(0.0001, t);
  sg.gain.exponentialRampToValueAtTime(0.6, t + 0.015);
  sg.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t + 0.5);
  playWhoosh(0, 0.18);
}

let currentMC = null;

function generateDistractors(correct, pool) {
  const distractors = new Set();
  // Keys by normalized meaning, so "15° cephalic" and "15 degrees cephalad" count as the same option.
  const seen = new Set([normalize(correct.crLocation)]);
  const addOpt = v => { const k = normalize(v); if (v && !seen.has(k)) { seen.add(k); distractors.add(v); } };
  // 1. One correct answer from a different projection
  const others = pool.filter(p => normalize(p.crLocation) !== normalize(correct.crLocation));
  if (others.length) {
    const other = others[Math.floor(Math.random() * others.length)];
    addOpt(other.crLocation);
  }
  // 2. Two close distractors
  const loc = correct.crLocation;
  // Try inch variations
  const inchVariants = [
    loc.replace(/(\d+(?:\/\d+)?|\d+–\d+)\s*inch/gi, (m, n) => {
      const num = parseFloat(n.split('/')[0]) || 1;
      return (num + 1) + ' inch';
    }),
    loc.replace(/(\d+(?:\/\d+)?|\d+–\d+)\s*inch/gi, (m, n) => {
      const num = parseFloat(n.split('/')[0]) || 1;
      return Math.max(0.5, num - 0.5) + ' inch';
    }),
    loc.replace(/midway|mid/gi, '1 inch medial to'),
    loc.replace(/MSP/gi, '2 inches lateral to MSP'),
    loc.replace(/T7/gi, 'T6'),
    loc.replace(/C4/gi, 'C5'),
    loc.replace(/iliac crest/gi, '2 inches above the iliac crest'),
    loc.replace(/patellar apex/gi, 'patellar base'),
  ];
  for (const v of inchVariants) {
    addOpt(v);
    if (distractors.size >= 3) break;
  }
  // Fill remaining with random other locations
  let guard = 0;
  while (distractors.size < 3 && others.length) {
    const o = others[Math.floor(Math.random() * others.length)];
    addOpt(o.crLocation);
    if (distractors.size >= 3 || ++guard > 200) break;
  }
  return Array.from(distractors).slice(0, 3);
}

function loadMC() {
  currentMC = data[Math.floor(Math.random() * data.length)];
  mcQuestionEl.textContent = `What is the CR Location for a ${currentMC.projection} ${currentMC.extremity}?`;
  const wrongs = generateDistractors(currentMC, data);
  const options = [currentMC.crLocation, ...wrongs];
  // Shuffle
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  mcFeedback.innerHTML = '';

    btn.onclick = () => selectMC(btn, opt);
    mcOptionsEl.appendChild(btn);
  });
}

function selectMC(btn, selected) {
  const buttons = mcOptionsEl.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  const isCorrect = selected === currentMC.crLocation;
  btn.style.borderColor = isCorrect ? '#00ba7c' : '#f4212e';
  btn.style.background = isCorrect ? '#0d3d2e' : '#3d1a1c';

    ? '<div class="feedback good">Correct!</div>'
    : `<div class="feedback bad">Wrong. Correct answer: ${currentMC.crLocation}</div>`;
  if (isCorrect) launchConfetti(); else wrongAnswerEffect();
}


function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function resetFocusProgress() {
  const pool = getQuizPool();
  focusQueue = shuffle(pool);
  focusIndex = 0;
  focusCorrect = 0;
  updateProgressDisplay();
}

function updateProgressDisplay() {
  if (quizMode !== 'focus') {
    progressEl.textContent = '';
    restartBtn.style.display = 'none';
    return;
  }
  const total = focusQueue.length;
  if (focusIndex >= total && total > 0) {
    progressEl.innerHTML = '<strong>Final score: ' + focusCorrect + ' out of ' + total + '</strong>';
    restartBtn.style.display = 'inline-block';
  } else {
    progressEl.textContent = focusCorrect + ' out of ' + total;
    restartBtn.style.display = 'none';
  }
}

function hasRotation(p) {
  const r = (p && p.rotation ? String(p.rotation) : '').trim().toLowerCase();
  return !!r && !['—','-','none','n/a','na'].includes(r);
}

function loadQuiz() {
  if (quizMode === 'focus') {
    if (focusIndex >= focusQueue.length) {
      quizQuestionEl.textContent = 'You have finished all projections for this extremity.';
      updateProgressDisplay();
      return;
    }
    currentQuiz = focusQueue[focusIndex];
  } else {
    const pool = getQuizPool();
    if (pool.length === 0) {
      quizQuestionEl.textContent = 'No projections available.';
      return;
    }
    currentQuiz = pool[Math.floor(Math.random() * pool.length)];
  }
  const hasRot = hasRotation(currentQuiz);
  quizQuestionEl.textContent = hasRot
    ? `What is the CR Degree and Direction, CR Location, and Body Part Rotation for a ${currentQuiz.projection} ${currentQuiz.extremity}?`
    : `What is the CR Degree and Direction, and CR Location for a ${currentQuiz.projection} ${currentQuiz.extremity}?`;
  quizDegreeEl.value = '';
  quizLocationEl.value = '';
  quizRotationEl.value = '';
  quizFeedback.innerHTML = '';
  rotationSection.classList.toggle('hidden', !hasRot);
  quizDegreeEl.focus();
}

function normalize(str) {
  return String(str || '')
    .toLowerCase()
    .replace(/°|degrees?|deg\b/g, ' degree ')  // treat °, degree, degrees, deg the same
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\bceph(?:alic(?:ally)?|alad|alically)?\b/g, 'cephalad') // cephalic = cephalad
    .replace(/\bcaud(?:al(?:ly)?|ad)?\b/g, 'caudad')                   // caudal = caudad
    .replace(/\s+/g, ' ')
    .trim();
}

function coreWords(str) {
  const stop = new Set(['entering','enters','enter','at','the','of','on','a','an','to','and','or','for','level','approximately','approx','degree','degrees']);
  return normalize(str)
    .replace(/\([^)]*\)/g, '') // remove parenthetical notes
    .split(' ')
    .filter(w => w.length > 1 && !stop.has(w));
}

function scoreRotation(user, correct) {
  if (!user || !String(user).trim()) return 'wrong';
  const nums = s => (String(s).match(/\d+(?:\.\d+)?/g) || []).map(Number);
  // turn ranges like 15–20 into [15, 20]
  const ranges = [];
  String(correct).replace(/(\d+(?:\.\d+)?)\s*[\u2013\-–to]+\s*(\d+(?:\.\d+)?)/g, (m, a, b) => { ranges.push([Number(a), Number(b)]); return m; });
  const cNums = nums(correct);
  if (cNums.length === 0) return scoreMatch(user, correct); // no number (e.g. "Right lateral"): compare words
  const uNums = nums(user);
  if (uNums.length === 0) return 'wrong';
  // only the number matters; medial/lateral/RPO/LPO wording is optional
  const ok = uNums.every(n => cNums.includes(n) || ranges.some(([a, b]) => n >= Math.min(a, b) && n <= Math.max(a, b)));
  return ok ? 'correct' : 'wrong';
}

// Pull numbers and ranges (e.g. 15–20°, 15 to 20 degrees) out of a raw string.
function degreeNumbers(str) {
  const s = String(str || '').toLowerCase();
  const ranges = [];
  s.replace(/(\d+(?:\.\d+)?)\s*(?:°|degrees?|deg)?\s*(?:-|\u2013|\u2014|to)\s*(\d+(?:\.\d+)?)/g, (m, a, b) => { ranges.push([Number(a), Number(b)]); return m; });
  const nums = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
  return { nums, ranges };
}
function directionTokens(str) {
  const n = ' ' + normalize(str) + ' ';
  return ['cephalad', 'caudad'].filter(d => n.includes(' ' + d + ' '));
}
// Number + cephalad/caudad answers. Returns 'correct' / 'close' / 'wrong', or null to use the general matcher.
function scoreDegreeDirection(user, correct) {
  const c = degreeNumbers(correct), u = degreeNumbers(user);
  const cDirs = directionTokens(correct), uDirs = directionTokens(user);
  if (!c.nums.length || !u.nums.length || !cDirs.length) return null;
  if (uDirs.some(d => !cDirs.includes(d))) return 'wrong'; // e.g. caudal when the answer is cephalad
  const inRange = n => c.nums.includes(n) || c.ranges.some(([a, b]) => n >= Math.min(a, b) && n <= Math.max(a, b));
  const numsOk = u.nums.every(inRange);
  if (numsOk && uDirs.length) return 'correct';
  return null; // leave other cases (e.g. number only) to the general matcher, as before
}

function scoreMatch(user, correct, field) {
  if (!user) return 'wrong';

  // Special case: Knee ASIS tabletop projections (CR degree only)
  if (field === 'degree' && currentQuiz && currentQuiz.extremity === 'Knee' && currentQuiz.crDegreeFull) {
    const u = normalize(user);
    const isPerp = /perpendicular|perp/.test(u);
    const isCaudal = /3.?5.*caudad|caudad.*3.?5/.test(u);       // normalize() turns caudal -> caudad
    const isCephalic = /3.?5.*cephalad|cephalad.*3.?5/.test(u); // and cephalic -> cephalad
    if (isPerp || isCaudal || isCephalic) return 'correct';
    return 'wrong';
  }

  if (field === 'degree') {
    const d = scoreDegreeDirection(user, correct);
    if (d) return d;
  }

  const uNorm = normalize(user);
  const cNorm = normalize(correct);
  const u = coreWords(user);
  const c = coreWords(correct);
  if (u.length === 0 || c.length === 0) return 'wrong';

  const uNums = uNorm.match(/\d+/g) || [];
  const cNums = cNorm.match(/\d+/g) || [];
  const numMatch = uNums.length > 0 && cNums.some(n => uNums.includes(n));

  const hits = u.filter(w => c.some(cw => cw.includes(w) || w.includes(cw))).length;
  const ratio = hits / Math.max(u.length, Math.min(c.length, 4));

  // Exact or very clear single-word match (e.g. "perpendicular")
  if (u.length === 1 && c.some(cw => cw.includes(u[0]) || u[0].includes(cw))) return 'correct';
  if (uNorm === cNorm || cNorm.includes(uNorm) || uNorm.includes(cNorm)) return 'correct';

  // Strong overlap
  if (numMatch && hits >= 2 && ratio >= 0.45) return 'correct';
  if (ratio >= 0.65 && hits >= 2) return 'correct';
  if (hits >= Math.min(c.length, 3) && hits >= 2) return 'correct';

  // Partial / similar but not solid enough → Pretty close
  if (ratio >= 0.25 || hits >= 1 || numMatch) return 'close';
  return 'wrong';
}

function checkAnswer() {
  if (!currentQuiz) return;
  const degreeResult = scoreMatch(quizDegreeEl.value, currentQuiz.crDegree, 'degree');
  const locResult = scoreMatch(quizLocationEl.value, currentQuiz.crLocation);
  const hasRot = hasRotation(currentQuiz);
  const rotResult = hasRot ? scoreRotation(quizRotationEl.value, currentQuiz.rotation) : null;

  const labels = { correct: 'Correct', close: 'Pretty close', wrong: 'Wrong' };
  const classes = { correct: 'good', close: 'close', wrong: 'bad' };

  let html = '';
  html += `<div class="feedback ${classes[degreeResult]}">CR Degree and Direction: ${labels[degreeResult]}</div>`;
  html += `<div class="feedback ${classes[locResult]}">CR Location: ${labels[locResult]}</div>`;
  if (hasRot) {
    html += `<div class="feedback ${classes[rotResult]}">Body Part Rotation: ${labels[rotResult]}</div>`;
  }
  html += `<div class="feedback" style="background:#1e2a3a; margin-top:0.8rem;">
    <strong>Correct answers:</strong><br>
    CR Degree & Direction: ${currentQuiz.crDegreeFull || currentQuiz.crDegree}<br>
    CR Location: ${currentQuiz.crLocation}`;
  if (hasRot) {
    html += `<br>Body Part Rotation: ${currentQuiz.rotation}`;
  }
  html += `</div>`;
  quizFeedback.innerHTML = html;

  if (quizMode === 'focus' && currentQuiz) {
    const degreeOk = scoreMatch(quizDegreeEl.value, currentQuiz.crDegree, 'degree') === 'correct';
    const locOk = scoreMatch(quizLocationEl.value, currentQuiz.crLocation) === 'correct';
    const hasRot = hasRotation(currentQuiz);
    const rotOk = !hasRot || scoreRotation(quizRotationEl.value, currentQuiz.rotation) === 'correct';
    if (degreeOk && locOk && rotOk) {
      focusCorrect++;
      launchConfetti();
    } else {
      wrongAnswerEffect();
    }
    focusIndex++;
    updateProgressDisplay();
  } else if (currentQuiz) {
    // Random Quiz confetti
    const degreeOk = scoreMatch(quizDegreeEl.value, currentQuiz.crDegree, 'degree') === 'correct';
    const locOk = scoreMatch(quizLocationEl.value, currentQuiz.crLocation) === 'correct';
    const hasRot = hasRotation(currentQuiz);
    const rotOk = !hasRot || scoreRotation(quizRotationEl.value, currentQuiz.rotation) === 'correct';
    if (degreeOk && locOk && rotOk) launchConfetti(); else wrongAnswerEffect();
  }
}

function setActiveTab(active) {
  [tabRef, tabRandom, tabFocus, tabMC].forEach(t => t.classList.remove('active'));
  active.classList.add('active');
}

tabRef.onclick = () => {
  setActiveTab(tabRef);
  refView.classList.remove('hidden');
  quizView.classList.add('hidden');
  mcView.classList.add('hidden');
  refControls.classList.remove('hidden');
  focusControls.classList.add('hidden');
};

tabRandom.onclick = () => {
  setActiveTab(tabRandom);
  quizMode = 'random';
  quizView.classList.remove('hidden');
  refView.classList.add('hidden');
  mcView.classList.add('hidden');
  refControls.classList.add('hidden');
  focusControls.classList.add('hidden');
  loadQuiz();
};

tabFocus.onclick = () => {
  setActiveTab(tabFocus);
  quizMode = 'focus';
  quizView.classList.remove('hidden');
  refView.classList.add('hidden');
  mcView.classList.add('hidden');
  refControls.classList.add('hidden');
  focusControls.classList.remove('hidden');
  resetFocusProgress();
  loadQuiz();
};

focusSelect.onchange = () => {
  if (quizMode === 'focus') {
    resetFocusProgress();
    loadQuiz();
  }
};

tabMC.onclick = () => {
  setActiveTab(tabMC);
  quizMode = 'mc';
  mcView.classList.remove('hidden');
  quizView.classList.add('hidden');
  refView.classList.add('hidden');
  refControls.classList.add('hidden');
  focusControls.classList.add('hidden');
  loadMC();
};

restartBtn.onclick = () => {
  resetFocusProgress();
  loadQuiz();
};

searchEl.addEventListener('input', render);
checkBtn.onclick = checkAnswer;

mcNextBtn.onclick = loadMC;

nextBtn.onclick = () => {
  if (quizMode === 'focus' && focusIndex < focusQueue.length) {
    loadQuiz();
  } else if (quizMode !== 'focus') {
    loadQuiz();
  }
};
quizDegreeEl.addEventListener('keydown', e => { if (e.key === 'Enter') quizLocationEl.focus(); });
quizLocationEl.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });

// Populate focused quiz dropdown
extremities.forEach(ext => {
  const opt = document.createElement('option');
  opt.value = ext;
  opt.textContent = ext;
  focusSelect.appendChild(opt);
});

renderFilters();
render();

document.addEventListener('click', function(e) {
  if (e.target.classList.contains('show-answer')) {
    const ans = e.target.nextElementSibling;
    if (ans && ans.classList.contains('answer')) {
      ans.classList.toggle('hidden');
      e.target.textContent = ans.classList.contains('hidden') ? 'Show Answer' : 'Hide Answer';
    }
  }
});
</script>
