  .ok > i { background:var(--good); } .ok .pct, .pct.ok { color:var(--good); }
  .mid > i { background:var(--warn); } .pct.mid { color:var(--warn); }

<script>
(function () {
  'use strict';
  var WORKER_URL = 'https://xraysavvy-ai.opsab10.workers.dev';
  var OWNER_ID = 'd08e9b9c-3e14-45f5-8ad0-44df864ff0ee'; // only hides/shows UI; the Worker and the RPC check it server-side
  // Free-tier limits (checked 2026-11-02 on each provider's pricing/limits page).
  var LIMITS = {
    workerPerDay: 100000,          // developers.cloudflare.com/workers/platform/limits (Workers Free, per account, resets 00:00 UTC)
    dbBytes: 500 * 1024 * 1024,    // supabase.com/pricing (Free: 500 MB database size)
    mau: 50000,                    // supabase.com/pricing (Free: 50,000 monthly active users)

    emailsPerDay: 100              // resend.com/pricing (Free: 100 emails a day)
  };
  var FEATURES = [
    ['questions', 'Quiz questions (Exam Cram)'],
    ['section', 'Summaries (Learn)'],
    ['explain:simple', 'ELI5 ("dumb it down")'],
    ['explain:detail', 'More detail'],
    ['ask', 'Ask a question'],

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(n) { return (n || 0).toLocaleString('en-US'); }
  function level(p) { return p > 85 ? 'hi' : p > 60 ? 'mid' : 'ok'; }
  function sum(obj, prefix) { var t = 0; for (var k in obj) if (k.indexOf(prefix) === 0) t += obj[k] || 0; return t; }
  function mb(b) { return (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB'; }

  function meter(label, used, limit, opts) {
    opts = opts || {};

      var p = Math.max(0, used / limit * 100);

      bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-valuenow', Math.round(p)); bar.setAttribute('aria-valuemin', 0); bar.setAttribute('aria-valuemax', 100);
      m.appendChild(bar);

  function card(title, src) {

  function render(w, db, errs) {

    // ---- AI (Gemini) ----
    var ai = card('🤖 AI requests (Gemini)', w ? 'Model ' + w.model + ' (fallback ' + w.fallbackModel + '). Daily quota resets at midnight Pacific.' : '');

        if (q) m.appendChild(el('div', 'raw', 'limit: ' + fmt(lim) + '/day for ' + model + ', reported by Google in a 429 on ' + new Date(q.seen).toLocaleDateString('en-US', { timeZone: 'America/Chicago' })));
        else if (i === 0) m.lastChild.textContent = 'limit: check Google AI Studio (Google no longer publishes free-tier numbers)';
        ai.appendChild(m);
        ai.appendChild(el('div', 'raw', 'This month: ' + fmt(month) + ' calls to ' + model));
      });
      var t = el('table'), hr = el('tr');
      hr.appendChild(el('th', '', 'Feature')); hr.appendChild(el('th', 'num', 'Today')); hr.appendChild(el('th', 'num', 'Month')); t.appendChild(hr);
      var tt = 0, tm = 0;
      FEATURES.forEach(function (f) {
        var a = w.todayPacific['req:' + f[0]] || 0, b = w.monthUtc['req:' + f[0]] || 0; tt += a; tm += b;
        var tr = el('tr'); tr.appendChild(el('td', '', f[1])); tr.appendChild(el('td', 'num', fmt(a))); tr.appendChild(el('td', 'num', fmt(b))); t.appendChild(tr);
      });
      var tr2 = el('tr'); tr2.appendChild(el('td', '', 'All AI features')); tr2.appendChild(el('td', 'num', fmt(tt))); tr2.appendChild(el('td', 'num', fmt(tm))); tr2.style.fontWeight = '700'; t.appendChild(tr2);
      ai.appendChild(t);
      ai.appendChild(el('div', 'note', 'Feature rows count requests to the Worker; the meter counts actual Gemini calls (a fallback retry is a second call). Today = since midnight Pacific; Month = calendar month (UTC).'));

    var dbc = card('🗄️ Database & accounts (Supabase)', 'Free plan: 500 MB database, 50,000 monthly active users.');
    if (db) {
      dbc.appendChild(meter('Storage', db.db_size_bytes, LIMITS.dbBytes, { usedText: mb(db.db_size_bytes), limitText: '500 MB' }));

      dbc.appendChild(el('div', 'raw', 'Total accounts shown against the 50,000 MAU limit (MAU is always ≤ accounts).'));
      var s = el('div', 'stats');
      [[db.accounts_new_7d, 'New (7 days)'], [db.accounts_unconfirmed, 'Unconfirmed'], [db.accounts_total, 'Accounts'], [db.decks_active, 'Decks (' + fmt(db.decks) + ' incl. deleted)'], [db.quiz_results, 'Quiz answers'], [mb(db.db_size_bytes), 'DB size']].forEach(function (x) {
        var st = el('div', 'stat'); st.appendChild(el('div', 'n', typeof x[0] === 'number' ? fmt(x[0]) : x[0])); st.appendChild(el('div', 'l', x[1])); s.appendChild(st);
      });
      dbc.appendChild(s);
    } else dbc.appendChild(el('div', 'err', errs.db || 'Database stats unavailable.'));
    cards.appendChild(dbc);

    // ---- Email ----
    var em = card('✉️ Auth emails (Resend via Supabase SMTP)', 'Resend Free: 3,000 emails / month and 100 emails / day.');
    if (db) {
      em.appendChild(meter('This month', db.emails_month_min, LIMITS.emailsPerMonth));
      em.appendChild(meter('Today (UTC)', db.emails_today_min, LIMITS.emailsPerDay));
      em.appendChild(el('div', 'note', 'Minimum count: Supabase keeps only the latest confirmation / reset / email-change send per user, so repeat sends to the same person are missed. The exact number is on the Resend dashboard.'));
    } else em.appendChild(el('div', 'err', errs.db || 'Email stats unavailable.'));
    cards.appendChild(em);

    // ---- Worker ----
    var wk = card('⚡ Worker requests (Cloudflare)', 'Workers Free: 100,000 requests / day per account, resets at midnight UTC.');
    if (w) {
      var dayAll = sum(w.todayUtc, 'req:');
      wk.appendChild(meter('Today (UTC)', dayAll, LIMITS.workerPerDay));

  // ---- Visitors (owner-only RPC admin_visitor_stats; days in America/Chicago) ----
  var includeOwnVisits = false;
  function fmtDay(d) {

  }

  }
  function renderVisitors(data, err) {
    var box = $('visitors'); box.textContent = '';

    var tot = data.totals || {};
    var s = el('div', 'stats su-stats');
    [[tot.views, 'Page views'], [tot.unique_visitors, 'Unique visitors'], [tot.guests, 'Guests'], [tot.signed_in, 'Signed-in']].forEach(function (x) {
      var st = el('div', 'stat'); st.appendChild(el('div', 'n', fmt(x[0]))); st.appendChild(el('div', 'l', x[1])); s.appendChild(st);
    });
    c.appendChild(s);
    var t = el('table', 'vis-day'), hr = el('tr');
    ['Day (CT)', 'Views', 'Unique', 'Guests', 'Signed-in'].forEach(function (h, i) {
      hr.appendChild(el('th', i ? 'num' : '', h));

  // ---- Recent sign-ups (owner-only RPC admin_recent_signups; returns email handles only) ----

      if (u.display_name) li.appendChild(el('div', 'su-name', u.display_name));
      li.appendChild(el('div', 'su-line', 'Joined ' + ctTime(u.created_at) + ' · ' + ago(u.created_at)));
      var last = [u.last_sign_in_at, u.last_quiz_at].filter(Boolean).sort().pop();
      li.appendChild(el('div', 'su-line', 'Last active ' + (last ? ago(last) : 'never') + ' · ' + fmt(u.quiz_answers) + ' quiz answer' + (u.quiz_answers === 1 ? '' : 's')));
      list.appendChild(li);
    });
    if (!rows.length) list.appendChild(el('li', 'su-item', 'No accounts yet.'));
    c.appendChild(list);
    box.appendChild(c);
  }
  async function loadSignups() {
    if (window.__USAGE_MOCK) { renderSignups(window.__USAGE_MOCK.signups, null); return; }
    try {
      var sb = await XRS.client();
      var r = await sb.rpc('admin_recent_signups', { limit_n: 25 });
      if (r.error) throw r.error;
      renderSignups(r.data, null);
    } catch (e) { renderSignups(null, 'Sign-ups unavailable: ' + (e.message || e)); }
  }

  // ---- Flashcard suggestions (owner-only RPCs; server checks private.app_admins) ----
  function renderMod(rows, err) {
    var box = $('fcmod'); box.textContent = '';
    var c = el('section', 'card'), head = el('div', 'su-head');
    head.appendChild(el('h2', '', '🃏 Flashcard suggestions'));
    var rb = el('button', 'icon-btn', '↻ Refresh'); rb.type = 'button'; rb.onclick = function () { rb.disabled = true; loadMod(); };
    head.appendChild(rb); c.appendChild(head);
    c.appendChild(el('p', 'src', 'Pending student suggestions. Approve publishes an edited copy as a Community card; nothing is public until you approve. Duplicate flags are automatic hints, not accuracy checks.'));
    if (!rows) { c.appendChild(el('div', 'err', err || 'Suggestions unavailable.')); box.appendChild(c); return; }
    if (!rows.length) c.appendChild(el('div', 'raw', 'No pending suggestions.'));
    rows.forEach(function (r) {
      var it = el('div', 'su-item fc-mod');
      var top = el('div', 'su-top'); top.appendChild(el('span', 'su-handle', (r.handle || '?') + '@…'));
      if (r.published_dups && r.published_dups.length) top.appendChild(chip('no', 'Already published: ' + r.published_dups.join(', ')));
      if (r.other_pending) top.appendChild(chip('new', r.other_pending + ' similar pending'));
      it.appendChild(top);
      it.appendChild(el('div', 'su-line', 'Submitted ' + ctTime(r.created_at)));
      function inp(label, v, area, max) { var l = el('label', 'mod-lab', label); var i = document.createElement(area ? 'textarea' : 'input'); i.className = 'mod-in'; i.value = v || ''; i.maxLength = max; if (area) i.rows = 3; l.appendChild(i); it.appendChild(l); return i; }
      var fs = inp('Subject', r.subject, false, 60), ft = inp('Term', r.term, false, 120), fd = inp('Definition', r.definition, true, 1000), fsrc = inp('Source', r.source, false, 300), fn = inp('Note to student (optional)', '', false, 500);
      var act = el('div', 'mod-act'), msg = el('div', 'raw');
      [['approve', '✓ Approve & publish'], ['merge', 'Already covered'], ['reject', '✕ Reject']].forEach(function (a) {
        var b = el('button', 'icon-btn', a[1]); b.type = 'button';
        b.onclick = async function () {
          act.querySelectorAll('button').forEach(function (x) { x.disabled = true; }); msg.textContent = 'Saving…';
          try {
            var sb = await XRS.client();
            var res = await sb.rpc('admin_review_flashcard_suggestion', { p_id: r.id, p_action: a[0], p_subject: fs.value.trim(), p_term: ft.value.trim(), p_definition: fd.value.trim(), p_source: fsrc.value.trim() || null, p_note: fn.value.trim() || null });
            if (res.error) throw res.error;
            msg.textContent = 'Done: ' + a[1]; it.classList.add('done');
          } catch (e) { msg.textContent = 'Failed: ' + (e.message || e); act.querySelectorAll('button').forEach(function (x) { x.disabled = false; }); }
        };
        act.appendChild(b);
      });
      it.appendChild(act); it.appendChild(msg); c.appendChild(it);
    });
    box.appendChild(c);
  }
  async function loadMod() {
    if (window.__USAGE_MOCK) { renderMod(window.__USAGE_MOCK.suggestions || [], null); return; }
    try { var sb = await XRS.client(); var r = await sb.rpc('admin_flashcard_suggestions', { p_status: 'pending' }); if (r.error) throw r.error; renderMod(r.data || [], null); }
    catch (e) { renderMod(null, 'Suggestions unavailable: ' + (e.message || e)); }
  }

  // ---- Student-shared cards (published directly by students, not reviewed). Owner can hide/unhide/remove for safety. ----
  function renderShared(rows, err) {
    var box = $('fcshared'); box.textContent = '';
    var c = el('section', 'card'), head = el('div', 'su-head');
    head.appendChild(el('h2', '', '👥 Student-shared cards'));
    var rb = el('button', 'icon-btn', '↻ Refresh'); rb.type = 'button'; rb.onclick = function () { rb.disabled = true; loadShared(); };
    head.appendChild(rb); c.appendChild(head);
    c.appendChild(el('p', 'src', 'Cards students chose to make public under a name they picked. Shown on the Flashcards tab as “Not reviewed”. Hide or remove anything unsafe or wrong; this never changes the student’s private card.'));
    if (!rows) { c.appendChild(el('div', 'err', err || 'Unavailable.')); box.appendChild(c); return; }
    if (!rows.length) c.appendChild(el('div', 'raw', 'No student-shared cards yet.'));
    rows.forEach(function (r) {
      var it = el('div', 'su-item fc-mod' + (r.hidden ? ' done' : ''));
      var top = el('div', 'su-top'); top.appendChild(el('span', 'su-handle', r.author_name + ' · ' + r.subject)); if (r.hidden) top.appendChild(chip('no', 'Hidden'));
      it.appendChild(top); it.appendChild(el('div', 'su-line', r.term + ' — ' + r.definition));
      var act = el('div', 'mod-act'), msg = el('div', 'raw');
      [[r.hidden ? 'unhide' : 'hide', r.hidden ? 'Unhide' : 'Hide'], ['remove', '✕ Remove']].forEach(function (a) {
        var b = el('button', 'icon-btn', a[1]); b.type = 'button';
        b.onclick = async function () {
          if (a[0] === 'remove' && !confirm('Remove this public copy? The student keeps their private card.')) return;
          act.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
          try { var sb = await XRS.client(); var res = await sb.rpc('admin_shared_flashcard_set', { p_id: r.id, p_action: a[0] }); if (res.error) throw res.error; msg.textContent = 'Done: ' + a[1]; loadShared(); }
          catch (e) { msg.textContent = 'Failed: ' + (e.message || e); act.querySelectorAll('button').forEach(function (x) { x.disabled = false; }); }
        };
        act.appendChild(b);
      });
      it.appendChild(act); it.appendChild(msg); c.appendChild(it);
    });
    box.appendChild(c);
  }
  async function loadShared() {
    if (window.__USAGE_MOCK) { renderShared(window.__USAGE_MOCK.shared || [], null); return; }
    try { var sb = await XRS.client(); var r = await sb.rpc('admin_shared_flashcards'); if (r.error) throw r.error; renderShared(r.data || [], null); }
    catch (e) { renderShared(null, 'Student-shared cards unavailable: ' + (e.message || e)); }
  }

  function show(which) { ['loading', 'private', 'dash'].forEach(function (id) { $(id).classList.toggle('hidden', id !== which); }); }

  // window.__USAGE_MOCK lets a test render the page without a live session.
  async function load() {
    if (window.__USAGE_MOCK) { show('dash'); render(window.__USAGE_MOCK.worker, window.__USAGE_MOCK.db, {}); loadSignups(); loadVisitors(); loadMod(); loadShared(); return; }
    var sb, session;
    try { sb = await XRS.client(); session = (await sb.auth.getSession()).data.session; } catch (e) { session = null; }
    if (!session || !session.user || session.user.id !== OWNER_ID) { show('private'); return; }
    var errs = {};
    var wP = fetch(WORKER_URL + '/?action=usage', { headers: { Authorization: 'Bearer ' + session.access_token }, cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status)); return j; }); })
      .catch(function (e) { errs.worker = 'Worker counts unavailable: ' + e.message; return null; });
    var dP = sb.rpc('admin_usage').then(function (r) { if (r.error) throw r.error; return r.data; })
      .catch(function (e) { errs.db = 'Database stats unavailable: ' + (e.message || e); return null; });
    var sP = loadSignups(); loadVisitors(); loadMod(); loadShared();
    var res = await Promise.all([wP, dP]);
    if (!res[0] && !res[1] && /private|not allowed/i.test((errs.worker || '') + (errs.db || ''))) { show('private'); return; }
    show('dash'); render(res[0], res[1], errs);
    await sP;
  }
  $('refresh').onclick = load;
  var lastUid = XRS.user && XRS.user.id;
  XRS.on(function (u) { var id = u && u.id; if (id !== lastUid) { lastUid = id; show('loading'); load(); } });
  load();
})();
</script>
</body>
</html>
